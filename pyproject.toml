[project]
name = "ai-exposure-atlas"
version = "0.1.0"
description = "India-native generative-AI exposure index for NCO-2015 occupations (IGIDR Paper 1)"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Suryadip Ghoshal" }]
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "pyfixest>=0.24",
    "pandera>=0.20",
    "matplotlib>=3.9",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pypdf>=6.14.2",
    "pdfplumber>=0.11.10",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
