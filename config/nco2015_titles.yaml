# NCO-2015 group (3-digit) and family (4-digit) titles.
#
# NCO-2015 adopts the ISCO-08 structure at the sub-major / minor / unit-group
# levels, so these titles are the ISCO-08 minor- and unit-group titles for the
# codes that occur in NCO-2015 Vol II. Three families (3127, 6116, 7419) have no
# ISCO-08 counterpart and are marked PENDING until checked against NCO-2015 Vol I.
# Source: ILO ISCO-08 structure (Vol 1); to be verified line-by-line against
# NCO-2015 Vol I (data/raw/nco/NCO-2015_Vol_I.pdf) before any paper use.
#
# Consumed by src/insights/atlas_grid.py (and available to other insight charts
# in place of the ad-hoc GROUP_NAMES dicts).

